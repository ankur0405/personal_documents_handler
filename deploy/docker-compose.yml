version: '3.8'

services:
  # Message Broker Infrastructure
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx1G"

  # The Brain: Triage and Slicing
  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    depends_on: [kafka]
    volumes:
      # AGNOSTIC MAPPING: Maps your Mac's SSD (from .env) to the virtual container path
      - "${SCAN_ROOT}:/app/storage:ro"
      - ./model_cache:/root/.paddlex
      - ./data/tmp:/app/data/tmp
    environment:
      KAFKA_BROKER_DOCKER: kafka:29092
      # The Python code now only looks at the virtual path
      SCAN_PATH: /app/storage
      WORKER_COUNT: ${WORKER_COUNT:-6}

  # The Muscle: OCR Workers
  ocr-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on: [kafka]
    deploy:
      replicas: ${WORKER_COUNT:-6}
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    volumes:
      - "${SCAN_ROOT}:/app/storage:ro"
      - ./model_cache:/root/.paddlex
      - ./data/tmp:/app/data/tmp
    environment:
      KAFKA_BROKER_DOCKER: kafka:29092
      SCAN_PATH: /app/storage
      WORKER_COUNT: ${WORKER_COUNT:-6}