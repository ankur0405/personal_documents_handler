version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx1G"

  producer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.producer
    depends_on:
      - kafka
    volumes:
      - "${SCAN_ROOT}:/app/storage:ro"
      - ../data/model_cache:/root/.paddlex
      - ../data/tmp:/app/data/tmp
    environment:
      KAFKA_BROKER: kafka:29092
      SCAN_PATH: /app/storage

  enricher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.enricher
    depends_on:
      - kafka
    deploy:
      replicas: 4
    volumes:
      - "${SCAN_ROOT}:/app/storage:ro"
      - ../data/model_cache:/root/.paddlex
      - ../data/tmp:/app/data/tmp
    environment:
      KAFKA_BROKER: kafka:29092

  sink:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sink
    depends_on:
      - kafka
    volumes:
      - ../data/lancedb_store:/app/data/lancedb_store
    environment:
      KAFKA_BROKER: kafka:9092