system:
  autotune: true # If autotune is True, this max_workers is a "soft limit" or fallback.
  cleanup_temp: true  # Set to false if you want to inspect unzipped files

  # TEXT SPLITTING
  chunk_size: 1000
  chunk_overlap: 100

  # MODEL SPECS
  model_name: "BAAI/bge-small-en-v1.5"
  model_dimension: 384

# --- ENTERPRISE PERFORMANCE TUNING ---
performance:
  # 1. THE GATEKEEPER
  # If RAM usage exceeds this %, new tasks are paused.
  # Set to 75-80 for Laptops, 90-95 for Dedicated Servers.
  ram_limit_percent: 80.0

  # 2. BATCHING
  # How many text chunks to send to the Embedding Model at once.
  # 32 is standard. 64/128 for powerful GPUs.
  embedding_batch_size: 32

  # 3. TIMINGS (The "Heartbeat")
  # How long to sleep (seconds) when the Worker Queue is full.
  queue_full_wait: 0.1

  # 4. How long to sleep (seconds) when RAM is too high (Cool down).
  ram_high_wait: 2.0

  # 5. How long to sleep (seconds) after a successful batch cleanup.
  cleanup_wait: 0.1

  # 6. THE KILL SWITCH (Supervisor Mode)
  # If a single worker process exceeds this MB, it is killed and restarted.
  # 2500MB (2.5GB) is a safe limit for OCR tasks.
  worker_bloat_limit_mb: 2500

supported_extensions:
  # Word Processing
  .docx: "src.extractors.office.DocxExtractor"
  .doc:  "src.extractors.office.DocxExtractor"
  .odt:  "src.extractors.office.DocxExtractor"

  # Presentations
  .pptx: "src.extractors.office.SlideExtractor"
  .ppt:  "src.extractors.office.SlideExtractor"
  .odp:  "src.extractors.office.SlideExtractor"

  # Spreadsheets
  .xlsx: "src.extractors.office.SpreadsheetExtractor"
  .xls:  "src.extractors.office.SpreadsheetExtractor"
  .csv:  "src.extractors.office.SpreadsheetExtractor"
  .ods:  "src.extractors.office.SpreadsheetExtractor"

  # Text & Markdown
  .txt: "src.extractors.office.TextExtractor"
  .md:  "src.extractors.office.TextExtractor"
  .rtf: "src.extractors.office.TextExtractor"

  # Keep your other specific extractors as they were
  .pdf:  "src.extractors.pdf.PDFExtractor"
  .msg:  "src.extractors.email.EmailExtractor"
  .eml:  "src.extractors.email.EmailExtractor"
  .jpg:  "src.extractors.image.ImageExtractor"
  .png:  "src.extractors.image.ImageExtractor"
  .jpeg: "src.extractors.image.ImageExtractor"
  .heic: "src.extractors.image.ImageExtractor"
  .webp: "src.extractors.image.ImageExtractor"  # Added
  .tiff: "src.extractors.image.ImageExtractor"  # Added

# --- Containers (New) ---
  .zip: "src.extractors.archive.ArchiveExtractor"
  .7z:  "src.extractors.archive.ArchiveExtractor"

llm:
  provider: "local_ollama"
  local_ollama:
    base_url: "http://localhost:11434/v1"
    model: "llama3"
    api_key: "ollama"

classifier:
  max_input_tokens: 3000
  confidence_threshold: 0.7

# Hardware Profiles are now just overrides for the defaults above
hardware_profiles:
  entry_level:
    mode_name: "Entry Level"
    description: "Low Resource Mode"

  balanced:
    mode_name: "Balanced Mode"
    description: "Standard Laptop Mode"

  high_performance:
    mode_name: "High Performance"
    description: "Server/Workstation Mode"

# --- PATHS ---
paths:
  # The code expects these specific keys
  raw_data: "/app/storage"
  lancedb: "/app/data/lancedb_store"
  model_cache: "/app/data/model_cache"

# --- SUPERVISOR SETTINGS ---
# New section to control the Timeout and Sniper logic
supervisor:
  # Kill worker if a single file takes longer than this (seconds)
  time_limit_sec: 180
  # Memory limit per worker before the 'Sniper' kills it (MB)
  worker_bloat_limit_mb: 2500
  # CPU threshold for the Auto-Scaler to spawn more workers
  cpu_threshold_percent: 50.0