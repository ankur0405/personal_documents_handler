system:
  autotune: true                        # <--- SET TO TRUE TO ENABLE AI CONFIG
  max_workers: 4                        # Parallel threads/processes
  chunk_size: 1000                      # Characters per vector chunk (approx 200 words)
  chunk_overlap: 100                    # Overlap to preserve context between chunks
  model_name: "BAAI/bge-small-en-v1.5" # The Brain
  model_dimension: 384                  # The Brain Size (MUST match the model!)

paths:
  target_folder: "/Volumes/Extreme SSD/Documents"
  db_path: "data/lancedb_store"

# The Registry: Maps extensions to their handler class
# This makes the system "discoverable" and decoupled.
supported_extensions:
  # Documents
  .pdf: "PDFExtractor"
  .docx: "DocxExtractor"
  .doc: "DocxExtractor"      # Fallback for now
  .txt: "TextExtractor"
  .md: "TextExtractor"

  # Data
  .xlsx: "SpreadsheetExtractor"
  .xls: "SpreadsheetExtractor"
  .csv: "SpreadsheetExtractor"

  # Presentations
  .pptx: "SlideExtractor"

  # Messages
  .msg: "EmailExtractor"

  # Images (OCR)
  .png: "ImageExtractor"
  .jpg: "ImageExtractor"
  .jpeg: "ImageExtractor"
  .heic: "ImageExtractor"

llm:
  # Provider can be 'openai' or 'local_ollama'
  provider: "local_ollama"
  
  # Settings for Local Ollama
  local_ollama:
    # 'host.docker.internal' allows Docker to talk to the Host machine (Mac/Windows)
    #base_url: "http://host.docker.internal:11434/v1" #when using docker
    base_url: "http://localhost:11434/v1"
    model: "llama3"  # or 'mistral', 'gemma'
    api_key: "ollama" # generic key required by client libraries

  # Settings for OpenAI (Future use)
  openai:
    model: "gpt-4-turbo"
    api_key_env_var: "OPENAI_API_KEY"

classifier:
  # Settings specific to the classification agent
  max_input_tokens: 3000
  confidence_threshold: 0.7

# --- HARDWARE OVERRIDES ---
# These control SPEED (Batch Size), not DATA STRUCTURE (Model Name)
hardware_profiles:
  entry_level:
    mode_name: "Entry Level"
    description: "Entry Level (Low RAM/CPU)"
    batch_size: 16
    max_workers: 2
  
  balanced:
    mode_name: "Balanced Mode"
    description: "Balanced (Standard Laptop)"
    batch_size: 32
  
  high_performance:
    mode_name: "High Performance"
    description: "High Performance (Workstation/Server)"
    batch_size: 64