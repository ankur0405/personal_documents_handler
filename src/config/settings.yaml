system:
  autotune: true
  # If autotune is True, this max_workers is a "soft limit" or fallback.
  # Autotune will calculate the real number based on CPU cores.
  max_workers: 4 
  
  chunk_size: 1000
  chunk_overlap: 100
  
  # DATA CONSISTENCY (Must match your DB)
  model_name: "BAAI/bge-small-en-v1.5"
  model_dimension: 384

# --- ENTERPRISE PERFORMANCE TUNING ---
performance:
  # 1. THE GATEKEEPER
  # If RAM usage exceeds this %, new tasks are paused.
  # Set to 75-80 for Laptops, 90-95 for Dedicated Servers.
  ram_limit_percent: 80.0
  
  # 2. BATCHING
  # How many text chunks to send to the Embedding Model at once.
  # 32 is standard. 64/128 for powerful GPUs.
  embedding_batch_size: 32
  
  # 3. TIMINGS (The "Heartbeat")
  # How long to sleep (seconds) when the Worker Queue is full.
  queue_full_wait: 0.1
  
  # How long to sleep (seconds) when RAM is too high (Cool down).
  ram_high_wait: 2.0
  
  # How long to sleep (seconds) after a successful batch cleanup.
  cleanup_wait: 0.1

paths:
  target_folder: "/Volumes/Extreme SSD/Documents"
  db_path: "data/lancedb_store"

supported_extensions:
  .pdf: "PDFExtractor"
  .docx: "DocxExtractor"
  .doc: "DocxExtractor"
  .txt: "TextExtractor"
  .md: "TextExtractor"
  .xlsx: "SpreadsheetExtractor"
  .xls: "SpreadsheetExtractor"
  .csv: "SpreadsheetExtractor"
  .pptx: "SlideExtractor"
  .msg: "EmailExtractor"
  .png: "ImageExtractor"
  .jpg: "ImageExtractor"
  .jpeg: "ImageExtractor"
  .heic: "ImageExtractor"

llm:
  provider: "local_ollama"
  local_ollama:
    base_url: "http://localhost:11434/v1"
    model: "llama3"
    api_key: "ollama"

classifier:
  max_input_tokens: 3000
  confidence_threshold: 0.7

# Hardware Profiles are now just overrides for the defaults above
hardware_profiles:
  entry_level:
    mode_name: "Entry Level"
    description: "Low Resource Mode"
  
  balanced:
    mode_name: "Balanced Mode"
    description: "Standard Laptop Mode"
  
  high_performance:
    mode_name: "High Performance"
    description: "Server/Workstation Mode"

performance:
  # 1. ADMISSION CONTROL
  # Stop accepting new files if global RAM usage is above this %
  ram_limit_percent: 80.0
  
  # 2. THE KILL SWITCH (Supervisor Mode)
  # If a single worker process exceeds this MB, it is killed and restarted.
  # 2500MB (2.5GB) is a safe limit for OCR tasks.
  worker_bloat_limit_mb: 2500
  
  # 3. BATCHING
  embedding_batch_size: 32